<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Media</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <h1>Add Media to Gallery</h1>
    <form id="gallery-form" enctype="multipart/form-data">
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" required><br><br>

        <label for="description">Description:</label>
        <textarea id="description" name="description" required></textarea><br><br>

        <label for="mediaType">Media Type:</label>
        <select id="mediaType" name="mediaType" required>
            <option value="image">Image</option>
            <option value="video">Video</option>
        </select><br><br>

        <label for="media">Media File:</label>
        <input type="file" id="media" name="media" accept="image/*,video/*" required><br><br>

        <button type="submit">Add Media</button>
    </form>

    <script src="js/admin.js"></script>
</body>
</html>

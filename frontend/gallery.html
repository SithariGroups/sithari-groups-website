<body>
    <header>
        <img src="images/Logo.png" alt="Logo" class="logo">
        <h1>Sithari Groups Gallery</h1>
    </header>

    <main id="gallery">
        <!-- Events Category -->
        <section class="gallery-section">
            <h2>Events</h2>
            <div class="gallery-grid" id="events-grid">
                <!-- Images and Videos will be dynamically loaded here -->
            </div>
        </section>

        <!-- Classes Category -->
        <section class="gallery-section">
            <h2>Classes</h2>
            <div class="gallery-grid" id="classes-grid">
                <!-- Images and Videos will be dynamically loaded here -->
            </div>
        </section>

        <!-- Instruments Category -->
        <section class="gallery-section">
            <h2>Instruments</h2>
            <div class="gallery-grid" id="instruments-grid">
                <!-- Images and Videos will be dynamically loaded here -->
            </div>
        </section>
    </main>

    <!-- Modal for Image/Video Popup -->
    <div id="modal" class="modal">
        <span id="close-modal" class="close">&times;</span>
        <div id="modal-content" class="modal-content">
            <img id="modal-image" src="" alt="Large View">
            <div id="modal-video" class="modal-video"></div>
            <p id="modal-description"></p>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Sithari Groups. All Rights Reserved.</p>
    </footer>

    <script src="js/gallery.js"></script>
</body>

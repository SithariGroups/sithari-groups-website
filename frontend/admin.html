<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <h1>Admin Panel</h1>
    
    <!-- Manage Events Section -->
    <section>
        <h2>Upcoming Events</h2>
        <a href="add-event.html">Add New Event</a>
        <table>
            <thead>
                <tr>
                    <th>Event Name</th>
                    <th>Date</th>
                    <th>Location</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="events-list">
                <!-- Events will be listed here -->
            </tbody>
        </table>
    </section>
    
    <!-- Manage Gallery Section -->
    <section>
        <h2>Gallery</h2>
        <a href="add-gallery-media.html">Add Media</a>
        <table>
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Media Type</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="gallery-list">
                <!-- Gallery items will be listed here -->
            </tbody>
        </table>
    </section>
    
    <script src="js/admin.js"></script>
</body>
</html>

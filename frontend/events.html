<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sithari Groups - Upcoming Events</title>
    <link rel="stylesheet" href="/frontend/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Styles for the gradient table */
        .gradient-table {
            width: 90%;
            margin: 20px auto;
            border-collapse: collapse;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .gradient-table thead {
            background: linear-gradient(to right, #6a11cb, #2575fc);
            color: white;
        }

        .gradient-table th,
        .gradient-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        .gradient-table tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .gradient-table tr:hover {
            background-color: #f1f1f1;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="events.html">Upcoming Events</a></li>
            <li><a href="music-instruments.html">Music Instruments</a></li>
            <li><a href="class-details.html">Class Details</a></li>
            <li><a href="feedback.html">Submit Feedback</a></li>
            <li><a href="contact.html">Contact Us</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="services.html">Service</a></li>
        </ul>
    </nav>

    <!-- Header -->
    <header>
        <img src="/frontend/images/Logo.png" alt="Logo" class="logo">
        <h1>Upcoming Events</h1>
    </header>

    <!-- Events Section -->
    <section id="events-list">
        <div class="events-container">
            <table class="gradient-table">
                <thead>
                    <tr>
                        <th>Event</th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Location</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Dynamic rows will be inserted here by JavaScript -->
                </tbody>
            </table>
        </div>
    </section>

    <!-- Footer -->

    <footer>
        <p>&copy; 2025 Sithari Groups</p>
        <p>
            <a href="https://www.facebook.com/SithariGroups" target="_blank">
                <i class="fab fa-facebook-f"></i> Facebook
            </a> |
            <a href="https://www.youtube.com/SithariGroups" target="_blank">
                <i class="fab fa-youtube"></i> YouTube
            </a>
        </p>
    </footer>

    <!-- JavaScript -->
    <script>
        // Fetch and display events from the backend
        async function fetchAndDisplayEvents() {
            const tableBody = document.querySelector('.gradient-table tbody');

            try {
                const response = await fetch('http://localhost:3000/events'); // Replace with your backend API URL
                const events = await response.json();

                tableBody.innerHTML = ''; // Clear any existing rows

                events.forEach(event => {
                    const row = document.createElement('tr');

                    row.innerHTML = `
                        <td>${event.event}</td>
                        <td>${event.date}</td>
                        <td>${event.time}</td>
                        <td>${event.location}</td>
                    `;
                    tableBody.appendChild(row);
                });
            } catch (error) {
                console.error('Error fetching events:', error);
                tableBody.innerHTML = `<tr><td colspan="4">Failed to load events. Please try again later.</td></tr>`;
            }
        }

        // Call the function when the page loads
        document.addEventListener('DOMContentLoaded', fetchAndDisplayEvents);
    </script>


</body>
</html>

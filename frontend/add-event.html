<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Event</title>
</head>
<body>
    <h1>Add Event</h1>
    <form id="eventForm" enctype="multipart/form-data">
        <label for="eventTitle">Event Title:</label>
        <input type="text" id="eventTitle" name="eventTitle" required><br><br>

        <label for="eventDate">Event Date:</label>
        <input type="date" id="eventDate" name="eventDate" required><br><br>

        <label for="eventDescription">Event Description:</label>
        <textarea id="eventDescription" name="eventDescription" required></textarea><br><br>

        <label for="eventImage">Event Image (optional):</label>
        <input type="file" id="eventImage" name="eventImage"><br><br>

        <button type="submit">Add Event</button>
    </form>

    <script>
        document.getElementById('eventForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const formData = new FormData();
            formData.append('eventTitle', document.getElementById('eventTitle').value);
            formData.append('eventDate', document.getElementById('eventDate').value);
            formData.append('eventDescription', document.getElementById('eventDescription').value);
            formData.append('eventImage', document.getElementById('eventImage').files[0]);

            fetch('http://localhost:5001/api/events/add', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                alert('Event added successfully');
                console.log(data);
            })
            .catch(error => {
                alert('Error adding event');
                console.error(error);
            });
        });
    </script>
</body>
</html>
